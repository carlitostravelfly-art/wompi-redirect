<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo…</title>
</head>
<body>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    let status =
        urlParams.get("status") ||
        urlParams.get("transactionStatus") ||
        urlParams.get("transaction_status") ||
        "FAILED"; // ⭐ Si Wompi no envía nada → es fallo

    console.log("Status recibido:", status);

    status = status.toUpperCase();

    const deepLink = `carlitostravel://pago?status=${encodeURIComponent(status)}`;

    console.log("Deep link generado:", deepLink);

    window.location.href = deepLink;
</script>

<h2>Procesando pago...</h2>
<p>Si no eres redirigido automáticamente, toca aquí:</p>

<a id="manualLink" href="#">Abrir App</a>

<script>
    document.getElementById("manualLink").href = 
        `carlitostravel://pago?status=${encodeURIComponent(status)}`;
</script>

</body>
</html>
