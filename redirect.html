<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo…</title>
</head>
<body>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    let status =
        urlParams.get("status") ||
        urlParams.get("transactionStatus") ||
        urlParams.get("transaction_status");

    // 🚨 Nunca enviar deep link vacío
    if (!status) status = "FAILED";

    const deepLink = `carlitostravel://pago?status=${status}`;

    console.log("🔗 Redirigiendo a:", deepLink);

    window.location.href = deepLink;
</script>

<h2>Procesando pago...</h2>
<p>Si no eres redirigido automáticamente, toca aquí:</p>
<a id="link" href="#">Abrir app</a>

<script>
    const params2 = new URLSearchParams(window.location.search);
    let st =
        params2.get("status") ||
        params2.get("transactionStatus") ||
        params2.get("transaction_status");

    if (!st) st = "FAILED";

    document.getElementById("link").href = `carlitostravel://pago?status=${st}`;
</script>
</body>
</html>
