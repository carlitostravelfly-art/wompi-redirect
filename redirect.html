<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo…</title>
</head>
<body>
<script>
    const urlParams = new URLSearchParams(window.location.search);

    // Wompi envía status en diferentes parámetros:
    const status =
        urlParams.get("status") ||
        urlParams.get("transactionStatus") ||
        urlParams.get("transaction_status") ||
        ""; // si viene vacío lo tratamos como aprobado

    // Construye el deep link hacia tu app
    const deepLink = `carlitostravel://pago${status ? `?status=${status}` : ""}`;

    // Redirige automáticamente
    window.location.href = deepLink;
</script>

<h2>Procesando pago...</h2>
<p>Si no eres redirigido automáticamente, toca aquí:</p>
<a id="link" href="#">Abrir app</a>

<script>
    const urlParams2 = new URLSearchParams(window.location.search);
    const st =
        urlParams2.get("status") ||
        urlParams2.get("transactionStatus") ||
        urlParams2.get("transaction_status") ||
        "";

    document.getElementById("link").href = `carlitostravel://pago${st ? `?status=${st}` : ""}`;
</script>
</body>
</html>
