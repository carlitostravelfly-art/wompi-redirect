<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo…</title>
</head>
<body>
<h2>Procesando pago...</h2>
<p>Si no eres redirigido automáticamente, toca aquí:</p>
<a id="link" href="#">Abrir app</a>

<pre id="debug" style="padding:20px; background:#eee; margin-top:20px;"></pre>

<script>
    const debugBox = document.getElementById("debug");

    // URL completa recibida
    const fullUrl = window.location.href;

    const params = new URLSearchParams(window.location.search);

    let status =
        params.get("status") ||
        params.get("transactionStatus") ||
        params.get("transaction_status");

    // Si no llega → marcar FAILED (temporal)
    if (!status) status = "NO_STATUS_RECEIVED";

    const deepLink = `carlitostravel://pago?status=${status}`;

    // Mostrar debug
    debugBox.innerText =
`URL recibida:
${fullUrl}

Parámetros detectados:
status: ${params.get("status")}
transactionStatus: ${params.get("transactionStatus")}
transaction_status: ${params.get("transaction_status")}

Status resultante:
${status}

Deep link generado:
${deepLink}
`;

    // Redirección automática
    window.location.href = deepLink;

    // Botón manual
    document.getElementById("link").href = deepLink;
</script>

</body>
</html>
