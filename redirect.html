<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo…</title>
</head>
<body>

<script>
    // Leer parámetros de la URL
    const params = new URLSearchParams(window.location.search);

    // Wompi envía diferentes nombres para el estado
    let status =
        params.get("status") ||
        params.get("transactionStatus") ||
        params.get("transaction_status") ||
        "";

    // 🔥 Si viene vacío → se toma como aprobado (iOS pasa vacío)
    if (!status || status.trim() === "") {
        status = "APPROVED";
    }

    status = status.toUpperCase();

    // Construir el deep link hacia la app
    const deepLink = `carlitostravel://pago?status=${status}`;

    console.log("➡️ Redirigiendo a:", deepLink);

    // Redirigir automáticamente
    window.location.href = deepLink;
</script>

<h2>Procesando pago…</h2>
<p>Si no eres redirigido automáticamente, toca aquí:</p>

<a id="fallbackLink" href="#">Abrir aplicación</a>

<script>
    // Configurar el enlace de fallback
    document.getElementById("fallbackLink").href = 
        `carlitostravel://pago?status=${status}`;
</script>

</body>
</html>
